services:
  - type: web
    name: devlens-backend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    build:
      dockerfilePath: backend/Dockerfile
      context: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devlens-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://devlens-frontend-5bh2.onrender.com
      - key: GITHUB_TOKEN
        value: ${GITHUB_TOKEN}
      - key: AI_BASE_URL
        value: ${AI_BASE_URL}
      - key: AI_API_KEY
        value: ${AI_API_KEY}
      - key: AI_MODEL
        value: ${AI_MODEL}
      - key: S3_ENDPOINT_URL
        value: ${S3_ENDPOINT_URL}
      - key: S3_BUCKET_NAME
        value: ${S3_BUCKET_NAME}
      - key: S3_ACCESS_KEY_ID
        value: ${S3_ACCESS_KEY_ID}
      - key: S3_SECRET_ACCESS_KEY
        value: ${S3_SECRET_ACCESS_KEY}
      - key: S3_REGION
        value: ${S3_REGION}
    healthCheck:
      path: /api/v1/health/ready
      initialSeconds: 30
      periodSeconds: 10
    autoDeploy: true

  - type: worker
    name: devlens-worker
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    build:
      dockerfilePath: backend/Dockerfile
      context: backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devlens-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET_KEY
        fromService:
          name: devlens-backend
          type: web
          property: AUTH_SECRET_KEY
      - key: AI_BASE_URL
        value: ${AI_BASE_URL}
      - key: AI_API_KEY
        value: ${AI_API_KEY}
      - key: AI_MODEL
        value: ${AI_MODEL}
      - key: GITHUB_TOKEN
        value: ${GITHUB_TOKEN}
      - key: S3_ENDPOINT_URL
        value: ${S3_ENDPOINT_URL}
      - key: S3_BUCKET_NAME
        value: ${S3_BUCKET_NAME}
      - key: S3_ACCESS_KEY_ID
        value: ${S3_ACCESS_KEY_ID}
      - key: S3_SECRET_ACCESS_KEY
        value: ${S3_SECRET_ACCESS_KEY}
      - key: S3_REGION
        value: ${S3_REGION}
    autoDeploy: true

  - type: web
    name: devlens-frontend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    build:
      dockerfilePath: frontend/Dockerfile
      context: frontend
      args:
        - VITE_API_BASE_URL
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: devlens-backend
          type: web
          property: RENDER_EXTERNAL_URL
    healthCheck:
      path: /
      initialSeconds: 30
      periodSeconds: 10
    autoDeploy: true

databases:
  - name: devlens-postgres
    region: oregon
    plan: free
    databaseName: devlens
    user: devlens

keyvalue:
  - name: devlens-redis
    region: oregon
    plan: free

# External S3-compatible object storage credentials (set as Render secrets)
# S3_ENDPOINT_URL
# S3_BUCKET_NAME
# S3_ACCESS_KEY_ID
# S3_SECRET_ACCESS_KEY
# S3_REGION