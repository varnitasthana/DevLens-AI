services:
  - type: web
    name: devlens-backend
    region: oregon
    plan: free
    runtime: docker
    build:
      dockerfilePath: backend/Dockerfile
      context: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devlens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: devlens-frontend
          type: web
          property: RENDER_EXTERNAL_URL
      - key: GITHUB_TOKEN
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
    healthCheck:
      path: /api/v1/health/ready
      initialSeconds: 30
      periodSeconds: 10
    autoDeploy: true
  - type: worker
    name: devlens-worker
    region: oregon
    plan: free
    runtime: docker
    build:
      dockerfilePath: backend/Dockerfile
      context: backend
    startCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devlens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: devlens-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET_KEY
        fromService:
          name: devlens-backend
          type: web
          envVarKey: AUTH_SECRET_KEY
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
    autoDeploy: true
  - type: web
    name: devlens-frontend
    region: oregon
    plan: free
    runtime: docker
    build:
      dockerfilePath: frontend/Dockerfile
      context: frontend
      args:
        - VITE_API_BASE_URL
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: devlens-backend
          type: web
          property: RENDER_EXTERNAL_URL
    healthCheck:
      path: /
      initialSeconds: 30
      periodSeconds: 10
    autoDeploy: true
  - type: pserv
    name: devlens-db
    region: oregon
    plan: free
    runtime: postgresql
    postgresMajorVersion: 16
    autoDeploy: true
  - type: keyvalue
    name: devlens-redis
    region: oregon
    plan: free
    runtime: redis
    redisMajorVersion: 7
    autoDeploy: true
# External S3-compatible object storage credentials (set as Render secrets via Dashboard)
# S3_ENDPOINT_URL
# S3_BUCKET_NAME
# S3_ACCESS_KEY_ID
# S3_SECRET_ACCESS_KEY
# S3_REGION